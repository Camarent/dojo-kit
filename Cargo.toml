[workspace]
resolver = "3"
members = ["crates/dojo-core", "crates/dojo-wasm", "crates/dojo-cli", "modules/registry", "modules/ja/rust", "modules/ru/rust"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.3.0"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = "symbols"
