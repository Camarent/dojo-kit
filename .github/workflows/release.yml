name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build and pack the release archive
        run: scripts/package-release.sh "$GITHUB_REF_NAME" dist
      - name: "Smoke test: unpack into an empty dir and build the showcase course"
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke"
          mkdir "$smoke"
          tar -xzf "dist/dojo-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C "$smoke"
          cd "$smoke"
          ./dojo build "$GITHUB_WORKSPACE/examples/showcase" --out "$smoke/out"
          if [ ! -f "$smoke/out/showcase/index.html" ]; then
            echo "smoke build missing out/showcase/index.html" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: dist
      - name: Create the release, or upload to it when it exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/*
          fi
